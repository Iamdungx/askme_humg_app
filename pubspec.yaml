name: askme_humg
description: AskMe HUMG
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.10.3 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Environment & Config
  flutter_dotenv: ^6.0.0

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_app_check: ^0.4.1+4
  firebase_messaging: ^16.1.1

  # Google Sign-In
  google_sign_in: ^7.2.0

  # State Management
  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.3+1
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^17.1.0

  # Networking
  dio: ^5.7.0

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI & UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  share_plus: ^12.0.1
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.3.0
  gap: ^3.0.1

  # Assets — runtime accessors generated by flutter_gen
  flutter_gen: ^5.12.0

  # Crypto — SHA-256 hash for OTP (UC-1.3)
  crypto: ^3.0.6

  # Utilities
  logger: ^2.5.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  lucide_icons_flutter: ^3.1.10
  shared_preferences: ^2.5.4
  flutter_svg: ^2.2.3
  path_provider: ^2.1.5
  app_links: ^7.0.0
  firebase_installations: ^16.3.6
  package_info_plus: ^9.0.0
  mailer: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  go_router_builder: ^4.2.0
  freezed: ^3.1.0
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.0+1
  flutter_gen_runner: ^5.12.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.0.1
  firebase_auth_mocks: ^0.15.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/icon/
    - assets/images/
    - assets/svgs/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

# flutter_gen — type-safe asset/font accessors
# Generate: dart run build_runner build --delete-conflicting-outputs
flutter_gen:
  output: lib/generated/
  line_length: 120
  integrations:
    flutter_svg: true
    lottie: true
  assets:
    enabled: true
    outputs:
      style: camel-case
  fonts:
    enabled: true

flutter_native_splash:
  color: "#0A0D1A"
  image: assets/images/app_icon.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  color_dark: "#0A0D1A"
  image_dark: assets/images/app_icon.png
  android_12:
    image: assets/images/app_icon.png
    icon_background_color: "#0A0D1A"
    image_dark: assets/images/app_icon.png
    icon_background_color_dark: "#0A0D1A"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_foreground: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  web:
    generate: false
