name: askme_humg
description: AskMe HUMG
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Environment & Config
  flutter_dotenv: ^5.1.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_app_check: ^0.3.2
  firebase_messaging: ^15.2.4

  # Google Sign-In
  google_sign_in: ^6.2.2

  # State Management
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Networking
  dio: ^5.7.0

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Dependency Injection
  get_it: ^7.7.0

  # UI & UX
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.3.0
  gap: ^3.0.1

  # Assets
  flutter_gen: ^5.12.0

  # Utilities
  logger: ^2.5.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  lucide_icons_flutter: ^3.1.10
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  freezed: ^3.1.0
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  melos: ^7.1.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/icon/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
        - asset: assets/fonts/Inter-Italic-VariableFont_opsz,wght.ttf
          style: italic

flutter_native_splash:
  color: "#0A0D1A"
  image: assets/images/app_icon.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  color_dark: "#0A0D1A"
  image_dark: assets/images/app_icon.png
  android_12:
    image: assets/images/app_icon.png
    icon_background_color: "#0A0D1A"
    image_dark: assets/images/app_icon.png
    icon_background_color_dark: "#0A0D1A"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_foreground: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  web:
    generate: false

# Melos RUNNER
melos:
  useRootAsPackage: true
  scripts:
    # Dependencies
    get:
      run: flutter pub get
      description: Tải dependencies Dart & Flutter

    # Codegen & Localization
    gen:l10n:
      run: flutter gen-l10n
      description: Sinh file đa ngôn ngữ bằng flutter gen-l10n

    # Assets
    icons:
      run: dart run flutter_launcher_icons
      description: Sinh icon khởi chạy cho Android/iOS

    splash:
      run: dart run flutter_native_splash:create
      description: Sinh màn hình splash cho Android/iOS

    # Build targets
    build:apk:
      run: flutter build apk --release
      description: Build APK Android (release)

    build:appbundle:
      run: flutter build appbundle --release
      description: Build App Bundle Android (AAB)

    build:ios:
      run: flutter build ipa --release
      description: Build iOS .ipa (cần macOS & codesign)

    # Cleanups
    clean:
      run: flutter clean
      description: Dọn dẹp build của Flutter

    # Format & analyze
    format:
      run: dart format lib test
      description: Định dạng mã Dart

    analyze:
      run: flutter analyze
      description: Phân tích tĩnh

    # Run (Android)
    run:android:debug:
      run: flutter run -d android --debug --dart-define=APP_ENV=debug
      description: Chạy Android debug với APP_ENV=debug

    run:android:stg:
      run: flutter run -d android --debug --dart-define=APP_ENV=stg
      description: Chạy Android debug với APP_ENV=stg (staging)

    run:android:release:
      run: flutter run -d android --release --dart-define=APP_ENV=release
      description: Chạy Android release với APP_ENV=release

    # Run (iOS)
    run:ios:debug:
      run: flutter run -d ios --debug --dart-define=APP_ENV=debug
      description: Chạy iOS debug với APP_ENV=debug

    run:ios:stg:
      run: flutter run -d ios --debug --dart-define=APP_ENV=stg
      description: Chạy iOS debug với APP_ENV=stg (staging)

    run:ios:release:
      run: flutter run -d ios --release --dart-define=APP_ENV=release
      description: Chạy iOS release với APP_ENV=release
