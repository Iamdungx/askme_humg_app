  <script>
    const path = window.location.pathname;
    const match = path.match(/^\/user\/(.+)$/);
    if (match) {
      const userId = match[1];
      const customSchemeUrl = `askme://user/${userId}`;

      // No App Store banner — using TestFlight

      // Update tagline
      document.querySelector('.tagline').innerHTML =
        'Mở ứng dụng để xem trang hồ sơ này<br>và gửi câu hỏi ẩn danh.';

      // Try opening app via custom scheme; if not installed, stay on page.
      const tryOpen = () => {
        const start = Date.now();
        window.location.href = customSchemeUrl;
        setTimeout(() => {
          // If app opened, this tab would have blurred — check elapsed time
          if (Date.now() - start < 1500) {
            // App not installed — redirect to TestFlight on iOS, stay on page otherwise
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
            if (isIOS) {
              window.location.href = 'https://testflight.apple.com/join/YGYs2VTb';
            } else {
              document.querySelector('.tagline').innerHTML =
                'Tải ứng dụng AskMe HUMG để xem trang hồ sơ<br>và gửi câu hỏi ẩn danh.';
            }
          }
        }, 1000);
      };

      // Small delay to let page render first
      setTimeout(tryOpen, 300);
    }
  </script>
