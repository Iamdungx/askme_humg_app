<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskMe HUMG</title>
  <meta name="description" content="Ứng dụng hỏi đáp ẩn danh dành cho sinh viên HUMG">
  <link rel="icon" type="image/png" href="/app_icon.png">
  <!-- iOS Smart App Banner -->
  <meta name="apple-itunes-app" content="app-id=APPSTORE_ID, app-argument=APP_DEEPLINK">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f13;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      padding: 24px;
    }

    .card {
      background: #1a1a24;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 48px 40px 44px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 32px 64px rgba(0,0,0,0.5);
    }

    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 15px;
      line-height: 1.65;
      color: rgba(255,255,255,0.45);
      margin-bottom: 36px;
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 28px;
    }

    .store-label {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .badges {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }

    .badge:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
    }

    .badge svg { flex-shrink: 0; }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/app_icon.png" alt="AskMe HUMG" class="logo">
    <h1>AskMe HUMG</h1>
    <p class="tagline">Gửi câu hỏi ẩn danh đến bạn bè.<br>Chia sẻ câu trả lời với cộng đồng HUMG.</p>

    <div class="divider"></div>

    <p class="store-label">Tải ứng dụng</p>
    <div class="badges">
      <a class="badge" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        App Store
      </a>
      <a class="badge" href="#">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3.18 23.76c.3.17.64.22.99.14l12.12-6.99-2.54-2.54-10.57 9.39zm-1.7-20.1C1.18 4 1 4.5 1 5.14v13.72c0 .64.18 1.14.49 1.48l.08.07 7.69-7.69v-.18L1.56 3.59l-.08.07zM20.49 10.46l-2.33-1.35-2.82 2.82 2.82 2.82 2.35-1.35c.67-.39.67-1.02-.02-1.94zM4.17.24L16.29 7.23l-2.54 2.54L3.18.38C3.53.3 3.87.35 4.17.24z"/>
        </svg>
        Google Play
      </a>
    </div>
  </div>

  <footer>© 2025 AskMe HUMG · Dành cho sinh viên Đại học Mỏ - Địa chất</footer>

  <script>
    const path = window.location.pathname;
    const match = path.match(/^\/user\/(.+)$/);
    if (match) {
      const userId = match[1];
      const customSchemeUrl = `askme://user/${userId}`;

      // Update smart app banner for iOS Safari
      const banner = document.querySelector('meta[name="apple-itunes-app"]');
      if (banner) {
        banner.setAttribute('content',
          `app-id=APPSTORE_ID, app-argument=${customSchemeUrl}`);
      }

      // Update tagline
      document.querySelector('.tagline').innerHTML =
        'Mở ứng dụng để xem trang hồ sơ này<br>và gửi câu hỏi ẩn danh.';

      // Try opening app via custom scheme; if not installed, stay on page.
      const tryOpen = () => {
        const start = Date.now();
        window.location.href = customSchemeUrl;
        setTimeout(() => {
          // If app opened, this tab would have blurred — check elapsed time
          if (Date.now() - start < 1500) {
            // App not installed — show install prompt
            document.querySelector('.tagline').innerHTML =
              'Tải ứng dụng AskMe HUMG để xem trang hồ sơ<br>và gửi câu hỏi ẩn danh.';
          }
        }, 1000);
      };

      // Small delay to let page render first
      setTimeout(tryOpen, 300);
    }
  </script>
</body>
</html>
